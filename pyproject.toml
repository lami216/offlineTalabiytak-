[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "talabiytak-product-images"
version = "1.0.0"
description = "Arabic offline product image manager"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "jinja2>=3.1", "pydantic-settings>=2.4", "python-multipart>=0.0.9", "pillow>=10.4", "openpyxl>=3.1,<4", "itsdangerous>=2.2", "typer>=0.12"]
[project.optional-dependencies]
desktop = ["aiosqlite>=0.20", "platformdirs>=4.2", "pywebview>=5.3", "filelock>=3.15", "uvicorn[standard]>=0.30", "pyinstaller>=6.10"]
web = ["pymongo>=4.11,<5", "imagekitio==4.2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27", "mongomock>=4.3"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"app/database/sqlite.py" = ["E501"]
"app/repositories/sqlite.py" = ["E501"]
"app/main.py" = ["E501"]
