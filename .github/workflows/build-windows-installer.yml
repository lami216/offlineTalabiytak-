name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  web-tests:
    name: Web tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e ".[web,dev]"
      - run: python -c "from app.main import create_app; print('web import ok')"
      - run: python -m pytest -q tests/web
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: git diff --check

  desktop-tests-and-build:
    name: Desktop tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e ".[desktop,dev]"
      - run: python -c "import desktop_launcher; print('desktop import ok')"
      - run: python -m pytest -q tests/desktop
      - run: python -m PyInstaller --noconfirm --clean Talabiytak.spec
      - name: Smoke test executable
        shell: pwsh
        run: '& (Join-Path $PWD "dist/Talabiytak/Talabiytak.exe") --smoke-test'
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -SkipChecks
      - name: Silent install smoke
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "dist-installer\Talabiytak-Setup.exe"
          $target = Join-Path $env:TEMP "Talabiytak Install"
          $installLog = Join-Path $env:TEMP "Talabiytak-install.log"

          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue

          $installerArguments = @(
              "/VERYSILENT"
              "/SUPPRESSMSGBOXES"
              "/NORESTART"
              "/DIR=`"$target`""
              "/LOG=`"$installLog`""
          ) -join " "

          $process = Start-Process `
              -FilePath $installer `
              -ArgumentList $installerArguments `
              -Wait `
              -PassThru

          if ($process.ExitCode -ne 0) {
              if (Test-Path $installLog) {
                  Get-Content $installLog
              }
              throw "Installer failed with exit code $($process.ExitCode)"
          }

          $installedExe = Join-Path $target "Talabiytak.exe"

          if (-not (Test-Path $installedExe)) {
              Write-Host "Files found under target:"
              Get-ChildItem $target -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Installer log:"
              if (Test-Path $installLog) {
                  Get-Content $installLog
              }
              throw "Installed executable was not found at $installedExe"
          }

          & $installedExe --smoke-test

          if ($LASTEXITCODE -ne 0) {
              throw "Installed executable smoke test failed."
          }

          $uninstaller = Join-Path $target "unins000.exe"

          if (-not (Test-Path $uninstaller)) {
              throw "Uninstaller was not found."
          }

          $uninstall = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @(
                  "/VERYSILENT",
                  "/SUPPRESSMSGBOXES",
                  "/NORESTART"
              ) `
              -Wait `
              -PassThru

          if ($uninstall.ExitCode -ne 0) {
              throw "Uninstaller failed with exit code $($uninstall.ExitCode)"
          }
      - name: Upload installer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Talabiytak-Windows-Installer-Install-Log
          path: ${{ runner.temp }}/Talabiytak-install.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Talabiytak-Windows-Installer
          path: |
            dist-installer/Talabiytak-Setup.exe
            dist-installer/Talabiytak-Setup.exe.sha256
            dist-installer/BUILD_REPORT.txt
